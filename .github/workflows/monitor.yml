name: 인터텍 공지 모니터

on:
  schedule:
    # 한국시간 월~금 08~18시에만 (UTC 기준으로 표현)
    - cron: '*/5 23 * * 0-4'   # KST 월~금 08시대
    - cron: '*/5 0-8 * * 1-5'  # KST 월~금 09~17시대
  workflow_dispatch:            # 수동 실행 버튼

permissions:
  contents: write               # seen.json 커밋용

concurrency:
  group: intertek-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 라이브러리 설치
        run: pip install requests beautifulsoup4

      - name: 공지 확인
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python monitor.py

      - name: 상태 저장 (seen.json 커밋)
        run: |
          git config user.name "intertek-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json || true
          git diff --cached --quiet || git commit -m "상태 갱신 [skip ci]"
          git push || true
